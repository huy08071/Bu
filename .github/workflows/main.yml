name: Build ChessFire Menu APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Tự động tạo mã nguồn ChessFire Menu
        run: |
          mkdir -p app/src/main/java/com/chessfire/menu

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ChessFireMenu"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.chessfire.menu"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.chessfire.menu"
                  minSdk = 24
                  targetSdk = 33
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:label="ChessFire Menu"
                  android:icon="@android:mipmap/sym_def_app_icon"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".FloatingMenuService"
                      android:enabled="true"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/chessfire/menu/MainActivity.kt
          package com.chessfire.menu

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#121212"))
                      setPadding(60, 60, 60, 60)
                  }

                  val title = TextView(this).apply {
                      text = "🔥 CHESSFIRE MENU"
                      textSize = 26f
                      setTextColor(Color.parseColor("#FF5722"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 60)
                  }

                  val btnStart = Button(this).apply {
                      text = "BẬT MENU GAME"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#E64A19"))
                          cornerRadius = 24f
                      }
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              Toast.makeText(this@MainActivity, "Hãy cấp quyền Hiển thị trên ứng dụng khác!", Toast.LENGTH_LONG).show()
                              val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                              startActivity(intent)
                          } else {
                              startService(Intent(this@MainActivity, FloatingMenuService::class.java))
                              Toast.makeText(this@MainActivity, "Đã bật ChessFire Menu!", Toast.LENGTH_SHORT).show()
                              moveTaskToBack(true)
                          }
                      }
                  }

                  val btnStop = Button(this).apply {
                      text = "TẮT MENU"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#424242"))
                          cornerRadius = 24f
                      }
                      val params = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = 35 }
                      layoutParams = params
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, FloatingMenuService::class.java))
                          Toast.makeText(this@MainActivity, "Đã tắt Menu!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  layout.addView(title)
                  layout.addView(btnStart, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  layout.addView(btnStop)
                  setContentView(layout)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/chessfire/menu/FloatingMenuService.kt
          package com.chessfire.menu

          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.*
          import kotlin.math.abs

          class FloatingMenuService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var rootLayout: FrameLayout
              private lateinit var floatingIcon: TextView
              private lateinit var menuPanel: LinearLayout
              private lateinit var params: WindowManager.LayoutParams

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 100
                      y = 250
                  }

                  rootLayout = FrameLayout(this)

                  // Icon nổi thu gọn
                  floatingIcon = TextView(this).apply {
                      text = "🔥\nCF"
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      setPadding(30, 20, 30, 20)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#D84315"))
                          cornerRadius = 100f
                          setStroke(4, Color.parseColor("#FFCCBC"))
                      }
                  }

                  // Bảng Menu chính
                  menuPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                      setPadding(35, 30, 35, 30)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#E61A1A2E"))
                          cornerRadius = 28f
                          setStroke(3, Color.parseColor("#FF5722"))
                      }
                  }

                  val header = TextView(this).apply {
                      text = "⚡ CHESSFIRE MOD v1.0 ⚡"
                      textSize = 16f
                      setTextColor(Color.parseColor("#FF7043"))
                      gravity = Gravity.CENTER
                      setPadding(20, 10, 20, 25)
                  }
                  menuPanel.addView(header)

                  // Các nút chức năng trong Menu
                  menuPanel.addView(createSwitch("Gợi ý nước đi (Auto Hint)"))
                  menuPanel.addView(createSwitch("Hiện đường kẻ (ESP Line)"))
                  menuPanel.addView(createSwitch("Mở khóa 120 FPS"))
                  menuPanel.addView(createSwitch("Giảm giật lag (Boost)"))

                  val speedLabel = TextView(this).apply {
                      text = "Tốc độ phản hồi: 50%"
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      setPadding(0, 15, 0, 5)
                  }
                  val seekBar = SeekBar(this).apply {
                      max = 100
                      progress = 50
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, b: Boolean) {
                              speedLabel.text = "Tốc độ phản hồi: $p%"
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  menuPanel.addView(speedLabel)
                  menuPanel.addView(seekBar)

                  // Hàng nút Thu gọn & Đóng
                  val btnRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setPadding(0, 25, 0, 0)
                  }

                  val btnMinimize = Button(this).apply {
                      text = "Thu gọn"
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#0288D1"))
                          cornerRadius = 16f
                      }
                      setOnClickListener {
                          menuPanel.visibility = View.GONE
                          floatingIcon.visibility = View.VISIBLE
                      }
                  }

                  val btnClose = Button(this).apply {
                      text = "Đóng"
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#C62828"))
                          cornerRadius = 16f
                      }
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { leftMargin = 25 }
                      layoutParams = lp
                      setOnClickListener {
                          stopSelf()
                      }
                  }

                  btnRow.addView(btnMinimize)
                  btnRow.addView(btnClose)
                  menuPanel.addView(btnRow)

                  rootLayout.addView(floatingIcon)
                  rootLayout.addView(menuPanel)

                  setupDragAndClick(floatingIcon, isIcon = true)
                  setupDragAndClick(header, isIcon = false)

                  windowManager.addView(rootLayout, params)
              }

              private fun createSwitch(label: String): Switch {
                  return Switch(this).apply {
                      text = label
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      setPadding(0, 12, 0, 12)
                      setOnCheckedChangeListener { _, isChecked ->
                          val status = if (isChecked) "BẬT" else "TẮT"
                          Toast.makeText(this@FloatingMenuService, "$label: $status", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              private fun setupDragAndClick(view: View, isIcon: Boolean) {
                  var initialX = 0
                  var initialY = 0
                  var initialTouchX = 0f
                  var initialTouchY = 0f

                  view.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = initialX + (event.rawX - initialTouchX).toInt()
                              params.y = initialY + (event.rawY - initialTouchY).toInt()
                              windowManager.updateViewLayout(rootLayout, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              val diffX = abs(event.rawX - initialTouchX)
                              val diffY = abs(event.rawY - initialTouchY)
                              if (diffX < 15 && diffY < 15 && isIcon) {
                                  floatingIcon.visibility = View.GONE
                                  menuPanel.visibility = View.VISIBLE
                              }
                              true
                          }
                          else -> false
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::rootLayout.isInitialized) {
                      windowManager.removeView(rootLayout)
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessFire-Menu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
